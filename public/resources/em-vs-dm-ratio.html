<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emerging vs Developed Markets — MSCI EM / MSCI World</title>
    <style>
      :root {
        --ink: #0d253d;
        --ink-mute: #64748d;
        --canvas-soft: #f6f9fc;
        --hairline: #e3e8ee;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--canvas-soft); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; }
      header { padding: 20px 24px; border-bottom: 1px solid var(--hairline); background: #fff; }
      .kicker { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 4px; }
      h1 { font-family: "Bitter", Georgia, serif; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
      p.sub { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-mute); max-width: 640px; }
      main { flex: 1; padding: 20px 24px; }
      .frame { width: 100%; height: 100%; min-height: 520px; border: 1px solid var(--hairline); background: #fff; }
      footer { padding: 12px 24px; border-top: 1px solid var(--hairline); font-size: 11px; color: var(--ink-mute); background: #fff; }
      footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--hairline); }
    </style>
  </head>
  <body>
    <header>
      <p class="kicker">Conversation aid · Live chart</p>
      <h1>Emerging vs Developed Markets</h1>
      <p class="sub">MSCI Emerging Markets divided by MSCI World — the long-run cycle between EM and DM leadership.</p>
    </header>
    <main>
      <iframe
        class="frame"
        src="https://www.longtermtrends.com/embed/emerging-vs-developed-markets/?chart=emerging-developed-ratio-chart&theme=light&scale=linear"
        title="MSCI Emerging Markets / MSCI World — LongtermTrends"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </main>
    <footer>
      Data: <a href="https://www.longtermtrends.com/emerging-vs-developed-markets/" target="_blank" rel="noopener">longtermtrends.com</a>
    </footer>
  </body>
</html>
